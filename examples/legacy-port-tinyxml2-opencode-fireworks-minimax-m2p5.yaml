schema_version: v1
job:
  id: tinyxml2-entity-port-opencode-minimax-m2p5
  name: Port tinyxml2 entity decoding path via OpenCode + FireworksAI MiniMax-M2.5
  environment:
    dockerfile:
      path: ./examples/legacy_tinyxml2/Dockerfile
    artifacts:
      - name: tinyxml2-src
        path: ./third_party/tinyxml2
        mount_to: ./third_party/tinyxml2
        type: codebase
      - name: xml-corpus
        path: ./examples/legacy_tinyxml2/data
        mount_to: ./examples/legacy_tinyxml2/data
        type: dataset
  target:
    id: tinyxml2-entity-port-problem
    title: tinyxml2 entity decoding compatibility + speed
    domain: legacy-porting
    goal: Preserve behavior exactly and reduce median decode time by at least 10%.
    constraints:
      - Preserve byte-for-byte output on all verification corpus files.
      - Keep public Rust API stable in src/lib.rs.
      - No unsafe Rust.
    input_contract:
      format: files
    output_contract:
      format: patch
      required_paths: [src/, Cargo.toml]
    verification:
      type: command
      command: bash examples/legacy_tinyxml2/verify.sh
      pass_condition: tests_passed == true && behavioral_match_rate == 1.0
      collect_metrics:
        - name: tests_passed
          source: verifier
          type: boolean
        - name: behavioral_match_rate
          source: verifier
          type: number
        - name: runtime_ms_median
          source: verifier
          type: number
          unit: ms
    scoring:
      mode: composite
      builtins: [runtime, compute, agent_cost]
    max_attempts_per_agent: 1
agents:
  - id: opencode-fireworks-minimax-m2p5
    persona: Port C++ behavior to Rust, prioritize exact compatibility first, then optimize hot paths.
    runtime:
      type: opencode
      executable: opencode
      args:
        - run
        - --format
        - default
        - --model
        - fireworks-ai/accounts/fireworks/models/minimax-m2p5
      prompt_mode: arg
      timeout_seconds: 240
runner:
  type: docker
  ephemeral: true
  parallelism: 1
  resource_limits:
    cpu: "4"
    memory: "8Gi"
orchestrator:
  selection_policy: best_score
  retry_policy: on_fail
  max_total_attempts: 1
reporting:
  output_dir: ./runs/tinyxml2-opencode-fireworks-minimax-m2p5
  emit: [json, trace]
metadata:
  note: Requires FIREWORKS_API_KEY in environment and opencode auth/provider access.
