schema_version: v1
job:
  id: tinyxml2-entity-port-opencode-minimax-m2p5-creative-personas
  name: tinyxml2 port via OpenCode + FireworksAI MiniMax-M2.5 (creative personas)
  environment:
    dockerfile:
      path: ./examples/legacy_tinyxml2/Dockerfile
    artifacts:
      - name: tinyxml2-src
        path: ./third_party/tinyxml2
        mount_to: ./third_party/tinyxml2
        type: codebase
      - name: xml-corpus
        path: ./examples/legacy_tinyxml2/data
        mount_to: ./examples/legacy_tinyxml2/data
        type: dataset
  target:
    id: tinyxml2-entity-port-problem
    title: tinyxml2 entity decoding compatibility + speed
    domain: legacy-porting
    goal: Preserve behavior exactly and reduce median decode time by at least 10%.
    constraints:
      - Preserve byte-for-byte output on all verification corpus files.
      - Keep public Rust API stable in src/lib.rs.
      - No unsafe Rust.
    input_contract:
      format: files
    output_contract:
      format: patch
      required_paths: [src/, Cargo.toml]
    verification:
      type: command
      command: bash examples/legacy_tinyxml2/verify.sh
      pass_condition: tests_passed == true && behavioral_match_rate == 1.0
      collect_metrics:
        - name: tests_passed
          source: verifier
          type: boolean
        - name: behavioral_match_rate
          source: verifier
          type: number
        - name: runtime_ms_median
          source: verifier
          type: number
          unit: ms
    scoring:
      mode: composite
      builtins: [runtime, compute, agent_cost]
    max_attempts_per_agent: 1
agents:
  - id: minimax-hacker
    persona: Creative systems hacker. Use out-of-the-box optimization tactics while preserving exact behavior.
    strategy: explore
    runtime:
      type: opencode
      executable: opencode
      args: [run, --format, default, --model, fireworks-ai/accounts/fireworks/models/minimax-m2p5]
      prompt_mode: arg
      timeout_seconds: 420
      prompt_template: |
        Think unconventionally: alter algorithm structure, precompute where safe,
        and remove hidden bottlenecks. Keep changes auditable and behavior-preserving.
  - id: minimax-biology-inspired
    persona: Bio-inspired optimizer. Apply nature-inspired strategies to structure and efficiency.
    strategy: balanced
    runtime:
      type: opencode
      executable: opencode
      args: [run, --format, default, --model, fireworks-ai/accounts/fireworks/models/minimax-m2p5]
      prompt_mode: arg
      timeout_seconds: 420
      prompt_template: |
        Use ideas like adaptive pathways, local heuristics, and resilience patterns
        inspired by biological systems, but map them to concrete code-level optimizations.
  - id: minimax-researcher
    persona: Research-oriented optimizer. Use state-of-the-art ideas and justify design choices.
    strategy: exploit
    runtime:
      type: opencode
      executable: opencode
      args: [run, --format, default, --model, fireworks-ai/accounts/fireworks/models/minimax-m2p5]
      prompt_mode: arg
      timeout_seconds: 420
      prompt_template: |
        Prioritize techniques consistent with modern compiler/runtime performance practices
        and parser optimization literature. Explain why each optimization should help.
runner:
  type: docker
  ephemeral: true
  parallelism: 3
  resource_limits:
    cpu: "6"
    memory: "12Gi"
orchestrator:
  selection_policy: best_score
  retry_policy: on_fail
  max_total_attempts: 3
reporting:
  output_dir: ./runs/tinyxml2-opencode-fireworks-minimax-m2p5-creative-personas
  emit: [json, trace]
metadata:
  note: Requires FIREWORKS_API_KEY and OpenCode auth.
